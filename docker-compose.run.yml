# RUN-IT: boot Haive from PUBLISHED images, with no source tree and no build.
#
#   docker compose -f docker-compose.yml -f docker-compose.run.yml up -d
#
# Layered over docker-compose.yml, which defines every service, its environment and its volumes.
# This file changes exactly two things: where api/worker/web come from, and the fact that a
# published-image install has to migrate its database before those three start.
#
# `build: !reset null` is required, not cosmetic. Compose MERGES overlays, so an `image:` alongside
# the base's `build:` would still build from a source tree this install does not have. `!reset`
# removes the key outright.
#
# HAIVE_VERSION pins the release and has no default on purpose: `${VAR:?message}` fails the command
# with that message rather than silently resolving to `latest`, because "which version is this
# install running" is the question every upgrade and rollback turns on. `haive upgrade` re-pins it
# in `.env`, and rolling back is re-pinning the previous value.
#
# HAIVE_REGISTRY is overridable so a per-customer channel (see serialized-chasing-thacker) can point
# at its own images without editing this file.

services:
  # Not in docker-compose.yml at all: the dev stack gets db-migrate from the dev override, so a
  # published-image install would otherwise boot against an unmigrated database. It runs the same
  # runner from the same api image — the corpus ships inside it — and api/worker/web wait for it.
  db-migrate:
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-api:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    container_name: ${HAIVE_INSTALL_ID:-haive}-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-haive}:${POSTGRES_PASSWORD:-haive_dev_password}@postgres:5432/${POSTGRES_DB:-haive}
    command: ['node', 'packages/database/dist/migrate/index.js']
    networks:
      - haive-network
    restart: 'no'

  # Three services in docker-compose.yml build from a local context, which a published install does
  # not have. MEASURED before this was handled: `up -d` failed with
  # `unable to prepare context: path "/install/docker/openrouter-compat-proxy" not found`, and the
  # same failure broke the ROLLBACK, which brings the whole stack up — a failed upgrade could not
  # undo itself.
  #
  # The two proxies are real runtime features — openrouter traffic is rewritten by one and ollama's
  # thinking control by the other — so they are PUBLISHED and pulled, exactly like api/worker/web.
  cli-sandbox:
    # The exception, and it loses nothing: this service exists only to build an image the worker
    # builds for itself at boot (`ensureSandboxCoreImage`), which is also what heals a pruned host.
    # Publishing it would ship a second copy of something already self-healing.
    profiles: ['build-only']

  ollama-thinking-proxy:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-ollama-thinking-proxy:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}

  openrouter-compat-proxy:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-openrouter-compat-proxy:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}

  api:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-api:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    # docker-compose.yml publishes NOTHING — every port the dev stack exposes comes from the dev
    # override, which a published-image install does not use. Without these the stack boots
    # healthy and is completely unreachable, which is the worst kind of working.
    #
    # Only web, api and the mail sink. Postgres, Redis and Ollama stay internal: the dev override
    # publishes them for host tooling, and an install that does not need that should not widen its
    # surface to get it.
    ports:
      - '${HAIVE_API_PORT:-3001}:3001'
    # Everything the in-app "Upgrade" button needs, and nothing it does not.
    #
    # HAIVE_INSTALL_DIR_HOST is the only one with no sane default, so it is the one that gates the
    # feature: the api hands it to `docker run -v`, which the DAEMON resolves on the HOST, so a
    # guess (`$PWD`, `process.cwd()`) silently bind-mounts the wrong directory. That is exactly how
    # the first real upgrade wrote its snapshot to a `/snapshots` nobody owned. Unset, the endpoint
    # refuses and says so; it never infers.
    #
    # `HAIVE_VERSION` is deliberately NOT passed: it is stamped into the image at build time, and a
    # compose-level copy would be a second source of truth that disagrees during a rollback — the
    # moment `.env` is re-pinned but the containers have not been recreated yet.
    environment:
      HAIVE_INSTALL_DIR_HOST: ${HAIVE_INSTALL_DIR_HOST:-}
      HAIVE_REGISTRY: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-haive}
      HAIVE_POSTGRES_VOLUME: ${HAIVE_POSTGRES_VOLUME:-}
      HAIVE_SNAPSHOT_HOST_DIR: ${HAIVE_SNAPSHOT_HOST_DIR:-}
      HAIVE_RELEASE_MANIFEST_URL: ${HAIVE_RELEASE_MANIFEST_URL:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  worker:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-worker:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  web:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-web:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    # The browser runs on the HOST and calls the api directly. It used to call the URL baked into
    # the image at build time, which meant the published web image could only reach an api on
    # 3001 — so an install whose port the installer had moved (because 3001 was taken, which is
    # the case the probe exists for) had a UI that could not reach its own api, while its
    # server-rendered pages worked. MEASURED on v0.2.0-rc.1. The origin is resolved at RUNTIME
    # now, from HAIVE_API_PORT in docker-compose.yml, so one published image serves any port.
    ports:
      - '${HAIVE_WEB_PORT:-3000}:3000'
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  # The install's own mail sink — password resets and notifications land here, so a self-hosted
  # user needs to be able to read it.
  mailpit:
    ports:
      - '${HAIVE_MAILPIT_PORT:-8025}:8025'
