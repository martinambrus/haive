# RUN-IT: boot Haive from PUBLISHED images, with no source tree and no build.
#
#   docker compose -f docker-compose.yml -f docker-compose.run.yml up -d
#
# Layered over docker-compose.yml, which defines every service, its environment and its volumes.
# This file changes exactly two things: where api/worker/web come from, and the fact that a
# published-image install has to migrate its database before those three start.
#
# `build: !reset null` is required, not cosmetic. Compose MERGES overlays, so an `image:` alongside
# the base's `build:` would still build from a source tree this install does not have. `!reset`
# removes the key outright.
#
# HAIVE_VERSION pins the release and has no default on purpose: `${VAR:?message}` fails the command
# with that message rather than silently resolving to `latest`, because "which version is this
# install running" is the question every upgrade and rollback turns on. `haive upgrade` re-pins it
# in `.env`, and rolling back is re-pinning the previous value.
#
# HAIVE_REGISTRY is overridable so a per-customer channel (see serialized-chasing-thacker) can point
# at its own images without editing this file.

services:
  # Not in docker-compose.yml at all: the dev stack gets db-migrate from the dev override, so a
  # published-image install would otherwise boot against an unmigrated database. It runs the same
  # runner from the same api image — the corpus ships inside it — and api/worker/web wait for it.
  db-migrate:
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-api:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    container_name: haive-db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-haive}:${POSTGRES_PASSWORD:-haive_dev_password}@postgres:5432/${POSTGRES_DB:-haive}
    command: ['node', 'packages/database/dist/migrate/index.js']
    networks:
      - haive-network
    restart: 'no'

  # THREE services in docker-compose.yml build from a local context, and a published install has no
  # source tree. MEASURED: `up -d` on a published install failed with
  # `unable to prepare context: path "/install/docker/openrouter-compat-proxy" not found`, and the
  # same failure broke the ROLLBACK path, which brings the whole stack up. So they are given a
  # profile and are simply not started here.
  #
  # `cli-sandbox` is build-only and losing nothing: the worker builds that image itself at boot
  # (`ensureSandboxCoreImage`), which is also what heals a pruned host.
  #
  # The two proxies ARE runtime features, and profiling them out is a KNOWN GAP rather than a
  # design: a published install cannot currently use the ollama-thinking or openrouter providers,
  # because their traffic is routed through these sidecars. Publishing them alongside api/worker/web
  # is the fix; until then this is honest rather than silently broken.
  cli-sandbox:
    profiles: ['build-only']
  ollama-thinking-proxy:
    profiles: ['not-published-yet']
  openrouter-compat-proxy:
    profiles: ['not-published-yet']

  api:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-api:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    # docker-compose.yml publishes NOTHING — every port the dev stack exposes comes from the dev
    # override, which a published-image install does not use. Without these the stack boots
    # healthy and is completely unreachable, which is the worst kind of working.
    #
    # Only web, api and the mail sink. Postgres, Redis and Ollama stay internal: the dev override
    # publishes them for host tooling, and an install that does not need that should not widen its
    # surface to get it.
    ports:
      - '${HAIVE_API_PORT:-3001}:3001'
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  worker:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-worker:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  web:
    build: !reset null
    image: ${HAIVE_REGISTRY:-ghcr.io/martinambrus}/haive-web:${HAIVE_VERSION:?set HAIVE_VERSION to the release you want, e.g. 0.2.0}
    # The browser runs on the HOST and calls the api directly, at the URL baked into the web image
    # at build time (NEXT_PUBLIC_API_URL, default http://localhost:3001). So changing
    # HAIVE_API_PORT away from 3001 needs a web image built for that port — the published one
    # assumes the default. Documented rather than solved; a per-install web build is the fix, and
    # it is the same constraint frictionless-bootstrapping-otter records.
    ports:
      - '${HAIVE_WEB_PORT:-3000}:3000'
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  # The install's own mail sink — password resets and notifications land here, so a self-hosted
  # user needs to be able to read it.
  mailpit:
    ports:
      - '${HAIVE_MAILPIT_PORT:-8025}:8025'
