name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to a full commit SHA, not a tag. A tag is a
# mutable ref the upstream owner can repoint, so `@v7` is a promise, not a
# contract; the SHA is the contract. Dependabot still bumps these -- it rewrites
# the SHA and the trailing version comment together -- so the pin costs nothing
# in maintenance. Keep the `# vX.Y.Z` comment: it is what makes the diff
# readable and what Dependabot keys its update on.

# Least-privilege GITHUB_TOKEN. No job here uses the token beyond cloning, so
# read-only on contents is the whole requirement; a job that later needs to
# comment or push must opt in explicitly with its own permissions block.
permissions:
  contents: read

# One group per pull request, one per main commit: a late push event for an older merge must not
# cancel a newer one's run, and a shared group replaces a pending run even without cancel-in-progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck, Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + database (required by other packages)
        run: |
          pnpm --filter @haive/database build
          pnpm --filter @haive/shared build

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # gen-modules.mjs and module.mjs belong to no package, so `pnpm test` never reaches them.
      - name: Module scripts
        run: pnpm test:scripts

      # `install/install.sh` is the one script in this repo that runs on a stranger's machine, out
      # of a `curl … | sh`, with no review step between us and them. It carried three
      # `# shellcheck disable=` directives written for a linter nothing ever ran.
      #
      # MEASURED before adding this: shellcheck reports ZERO findings on that file, so the gate has
      # no backlog to work through. It is scoped to the installer and dev.sh rather than every
      # `*.sh` because the other four scripts carry style notes (SC2034 on loop counters, one
      # SC2086) that belong to their own change, not to this one.
      #
      # It is not hypothetical coverage: a `die "… `docker compose up -d` succeeded …"` written
      # while fixing the installer put a live COMMAND SUBSTITUTION inside an error message, which
      # `sh -n` accepts because it is valid syntax. shellcheck flagged it as SC2006 on the exact
      # line.
      # PINNED BY DIGEST, for the same reason every action above is pinned to a SHA: a linter is
      # only a gate if its verdict is reproducible. The first version of this step used whatever
      # shellcheck the runner image happened to carry, and MEASURED that is not one thing —
      # ubuntu's build reported SC2015 on a line that 0.11.0 passes, so the gate went red on code
      # that had been checked. An unpinned linter fails builds nobody caused, and the fix for the
      # finding it did raise is in `install.sh`, not in a suppression here.
      - name: Shellcheck the installer and dev.sh
        run: |
          set -euo pipefail
          image=koalaman/shellcheck@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          scripts/ci-retry.sh docker pull "$image"
          docker run --rm -v "$PWD:/mnt:ro" "$image" \
            --shell=sh install/install.sh install/test/boot-failures.sh
          docker run --rm -v "$PWD:/mnt:ro" "$image" --shell=bash scripts/dev.sh

      # The installer's BOOT block, which nothing else runs. `platform-checks.yml` installs with
      # `--no-start` and boots through the generated `./haive`, deliberately — a full `up` pulls
      # ~15 GB, 9.19 of it ollama, and once spent 50+ minutes — so pull/up/health has never
      # executed in CI on any platform. This drives it with `docker` and `curl` STUBBED, which
      # needs no daemon, no network and no images, and so belongs here rather than behind that
      # pull.
      - name: Installer boot-failure paths
        run: sh install/test/boot-failures.sh

  smokes:
    name: End-to-end smokes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: haive
          POSTGRES_PASSWORD: haive_dev_password
          POSTGRES_DB: haive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haive -d haive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Only for the gated tests that need the vector extension.
      pgvector:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: haive
          POSTGRES_PASSWORD: haive_dev_password
          POSTGRES_DB: haive
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U haive -d haive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://haive:haive_dev_password@localhost:5432/haive
      REDIS_URL: redis://localhost:6379
      CONFIG_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      JWT_SECRET: ci-smoke-jwt-secret-not-real-just-for-smoke-tests-padding
      NODE_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + database
        run: |
          pnpm --filter @haive/database build
          pnpm --filter @haive/shared build

      - name: Configure redis maxmemory-policy
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET maxmemory-policy noeviction

      # The same applier every install uses. On CI's empty database this exercises the FRESH
      # path — baseline plus every later migration — on every run.
      - name: Apply database migrations
        run: pnpm --filter @haive/database migrate

      # A gated file skips green when its URL is unset, so each must report tests run and none skipped.
      # The database column is the name each file's own guard demands.
      - name: Postgres-gated tests
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PGVECTOR_CONTAINER: ${{ job.services.pgvector.id }}
          INTEGRATIONS_BROKER_TEST_REDIS_URL: redis://localhost:6379/13
          MODULE_PURGE_API_TEST_REDIS_URL: redis://localhost:6379/12
        run: |
          set -uo pipefail
          pnpm --filter @haive/web-kit build
          pnpm --filter './modules/*' build
          node scripts/gen-modules.mjs
          failed=0
          while IFS=' ' read -r pkg file var db server; do
            [ -n "$pkg" ] || continue
            echo "::group::$pkg $file ($var, database $db on $server)"
            if [ "$server" = pgvector ]; then container="$PGVECTOR_CONTAINER"; port=5433; else container="$PG_CONTAINER"; port=5432; fi
            url="postgres://haive:haive_dev_password@localhost:$port/$db"
            report="$RUNNER_TEMP/$db.json"
            rm -f "$report"
            exists=$(docker exec "$container" psql -U haive -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'")
            if [ "$exists" != 1 ]; then
              docker exec "$container" psql -U haive -d postgres -c "CREATE DATABASE $db" \
                || { echo "::error::could not create $db"; failed=1; echo "::endgroup::"; continue; }
            fi
            DATABASE_URL="$url" pnpm --filter @haive/database migrate \
              || { echo "::error::migrate failed for $db"; failed=1; echo "::endgroup::"; continue; }
            env "$var=$url" pnpm --filter "@haive/$pkg" exec vitest run "$file" --reporter=default --reporter=json --outputFile.json="$report" \
              || { echo "::error::$file failed"; failed=1; }
            REPORT="$report" FILE="$file" node -e '
              const r = JSON.parse(require("fs").readFileSync(process.env.REPORT, "utf8"));
              console.log(process.env.FILE + ": passed=" + r.numPassedTests + " failed=" + r.numFailedTests + " skipped=" + r.numPendingTests + " todo=" + r.numTodoTests);
              if (!(r.numPassedTests > 0) || r.numPendingTests > 0 || r.numTodoTests > 0) {
                console.log("::error::" + process.env.FILE + " did not run in full");
                process.exit(1);
              }
            ' || failed=1
            echo "::endgroup::"
          done <<'GATED'
          worker test/database-snapshots.test.ts DATABASE_SNAPSHOT_TEST_URL snapshot_test pg
          worker test/task-type-seed.test.ts TASK_TYPE_SEED_TEST_URL task_type_seed_test pg
          worker test/task-type-seed-guard.test.ts TASK_TYPE_SEED_GUARD_TEST_URL task_type_seed_guard_test pg
          worker test/module-task-type-seed.test.ts MODULE_TASK_TYPE_SEED_TEST_URL module_task_type_seed_test pg
          worker test/step-catalog-sync.test.ts STEP_CATALOG_TEST_URL step_catalog_test pg
          worker test/type-draft-detect.test.ts TYPE_DRAFT_DETECT_TEST_URL type_draft_detect_test pg
          worker test/module-intent.test.ts MODULE_INTENT_TEST_URL module_intent_test pg
          worker test/module-deactivated-step.test.ts MODULE_DEACTIVATED_STEP_TEST_URL module_deactivated_step_test pg
          worker test/module-teardown.test.ts MODULE_TEARDOWN_TEST_URL module_teardown_test pg
          worker test/boot-module-window.test.ts BOOT_MODULE_WINDOW_TEST_URL boot_module_window_test pg
          worker test/cancel-sandbox-fence.test.ts CANCEL_FENCE_TEST_URL cancel_fence_test pg
          worker test/pending-fail-path.test.ts PENDING_FAIL_PATH_TEST_URL pending_fail_path_test pg
          worker test/dead-task-boot.test.ts DEAD_TASK_BOOT_TEST_URL dead_task_boot_test pg
          api test/task-type-definition.test.ts TASK_TYPE_DEF_TEST_URL task_type_def_test pg
          api test/task-types-routes-db.test.ts TASK_TYPES_API_TEST_URL task_types_api_test pg
          api test/task-type-drafts-db.test.ts TASK_TYPE_DRAFTS_TEST_URL task_type_drafts_test pg
          api test/task-custom-steps-db.test.ts TASK_CUSTOM_STEPS_TEST_URL task_custom_steps_test pg
          api test/module-deactivation-db.test.ts MODULE_DEACTIVATION_API_TEST_URL module_deactivation_api_test pg
          api test/module-missing-db.test.ts MODULE_MISSING_API_TEST_URL module_missing_api_test pg
          api test/module-purge-db.test.ts MODULE_PURGE_API_TEST_URL module_purge_api_test pg
          api test/task-create-path.test.ts TASK_CREATE_PATH_TEST_URL task_create_path_test pg
          api test/task-list-dead.test.ts TASK_LIST_DEAD_TEST_URL task_list_dead_test pg
          api test/integrations-broker.test.ts INTEGRATIONS_BROKER_TEST_URL integrations_broker_test pg
          api test/custom-mcp-db.test.ts CUSTOM_MCP_TEST_URL custom_mcp_test pg
          shared test/create-database-race.test.ts RACE_PG_URL create_database_race_test pg
          shared test/integrations-refresh-db.test.ts INTEGRATIONS_REFRESH_TEST_URL integrations_refresh_test pg
          shared test/integrations-clients-db.test.ts INTEGRATIONS_CLIENTS_TEST_URL integrations_clients_test pg
          shared test/integrations-resolution-db.test.ts INTEGRATIONS_RESOLUTION_TEST_URL integrations_resolution_test pg
          database test/integration-connection-keys.test.ts INTEGRATION_KEYS_TEST_URL integration_keys_test pg
          api test/admin-integrations-db.test.ts ADMIN_INTEGRATIONS_TEST_URL admin_integrations_test pg
          api test/integration-choice-routes-db.test.ts INTEGRATION_CHOICE_ROUTES_TEST_URL integration_choice_routes_test pg
          api test/integration-mcp-db.test.ts INTEGRATION_MCP_TEST_URL integration_mcp_test pg
          api test/tooling-app-auth-atomic-db.test.ts TOOLING_APP_AUTH_TEST_URL tooling_app_auth_test pg
          api test/task-tool-usage-calls-db.test.ts TASK_TOOL_USAGE_TEST_URL task_tool_usage_test pg
          api test/repo-delete-lock-order-db.test.ts REPO_DELETE_LOCK_ORDER_TEST_URL repo_delete_lock_order_test pg
          api test/admin-config-pool-db.test.ts ADMIN_CONFIG_POOL_TEST_URL admin_config_pool_test pg
          worker test/step-integrations-stamp-db.test.ts STEP_INTEGRATIONS_STAMP_TEST_URL step_integrations_stamp_test pg
          worker test/step-integrations-dispatch-db.test.ts STEP_INTEGRATIONS_DISPATCH_TEST_URL step_integrations_dispatch_test pg
          worker test/step-integrations-prompt-db.test.ts STEP_INTEGRATIONS_PROMPT_TEST_URL step_integrations_prompt_test pg
          worker test/step-integrations-decisions-db.test.ts STEP_INTEGRATIONS_DECISIONS_TEST_URL step_integrations_decisions_test pg
          worker test/prompt-step-integrations-dispatch-db.test.ts PROMPT_STEP_INTEGRATIONS_TEST_URL prompt_step_integrations_test pg
          worker test/step-integrations-module-provider-db.test.ts STEP_INTEGRATIONS_MODULE_PROVIDER_TEST_URL step_integrations_module_provider_test pg
          api test/task-integration-lock-routes-db.test.ts TASK_INTEGRATION_LOCK_TEST_URL task_integration_lock_test pg
          shared test/integrations-task-lock-db.test.ts INTEGRATIONS_TASK_LOCK_TEST_URL integrations_task_lock_test pg
          shared test/module-integrations-state-db.test.ts MODULE_INTEGRATIONS_STATE_TEST_URL module_integrations_state_test pg
          api test/module-integrations-routes-db.test.ts MODULE_INTEGRATIONS_ROUTES_TEST_URL module_integrations_routes_test pg
          shared test/global-kb-identifier-tsv.test.ts HAIVE_GKB_TEST_DB_URL gkb_identifier_tsv_test pgvector
          shared test/global-kb-ensure-bound.test.ts HAIVE_GKB_TEST_DB_URL gkb_ensure_bound_test pgvector
          worker test/rag-schema.test.ts HAIVE_GKB_TEST_DB_URL rag_schema_test pgvector
          GATED
          exit "$failed"

      # api smokes first: they are seconds each, so a broken route surfaces before the
      # worker suite spends most of the job's 30-minute budget. smoke:terminal is
      # excluded from smoke:ci — it needs a docker daemon and pulls an image, the same
      # reason the worker job leaves smoke:sub-agent out of its own smoke:ci.
      - name: Run api smokes
        run: pnpm --filter @haive/api smoke:ci

      - name: Run worker smokes
        run: pnpm --filter @haive/worker smoke:ci

      - name: Agent pool script on a real Redis
        run: pnpm --filter @haive/worker exec vitest run src/queues/cli-exec/agent-lease.test.ts
        env:
          HAIVE_LEASE_TEST_REDIS_URL: redis://localhost:6379/15

      - name: RAG sync lock on a real Redis
        run: pnpm --filter @haive/shared exec vitest run test/rag-sync-lock.test.ts
        env:
          HAIVE_RAG_LOCK_TEST_REDIS_URL: redis://localhost:6379/14

      - name: Usage-auth stash script on a real Redis
        run: pnpm --filter @haive/api exec vitest run test/cli-providers-usage-auth.test.ts
        env:
          USAGE_AUTH_TEST_REDIS_URL: redis://localhost:6379/12

      # The migration runner's live-database coverage. Not part of smoke:ci, which is
      # worker-scoped; this package had no smoke of its own before.
      - name: Run migration smokes
        run: pnpm --filter @haive/database smoke:migrate

  schema-parity:
    name: Schema parity (migrations == push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The check that lets 0000_baseline.sql stay FROZEN. The baseline legitimately falls behind
    # the Drizzle barrel the moment the next numbered migration lands, so "regenerate and diff
    # the file" would fail by design; what must hold is END-STATE equivalence. It is also the
    # guard that makes the dev loop safe -- a schema change pushed but committed without its
    # migration turns this job red instead of diverging every other install in silence.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: haive
          POSTGRES_PASSWORD: haive_dev_password
          POSTGRES_DB: haive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U haive -d haive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + database
        run: |
          pnpm --filter @haive/database build
          pnpm --filter @haive/shared build

      # PG_CONTAINER is the service container id: the script runs psql and pg_dump INSIDE it,
      # because ubuntu-latest ships a client older than PG18 and pg_dump refuses a newer server.
      # Same reason the smokes job reaches redis through `docker exec <service id>`.
      - name: Compare migration corpus against push --force
        run: bash packages/database/scripts/schema-parity.sh
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_PASSWORD: haive_dev_password

      # The production stage is never built by compose-boot (the dev override pins
      # `target: deps`), so without this nothing exercises the COPY that puts the migration
      # corpus into a shipped image — and the updater in steadfast-committing-gray runs the
      # runner from exactly that image, with no source tree to fall back on.
      - name: Migration corpus reaches the production image
        run: |
          scripts/ci-retry.sh docker build --target production -f packages/api/Dockerfile -t haive-api-prod-check .
          docker run --rm haive-api-prod-check \
            node -e "const {readdirSync}=require('fs');
                     const d='packages/database/migrations';
                     const f=readdirSync(d);
                     if(!f.includes('0000_baseline.sql')) throw new Error('baseline missing from image: '+f.join(','));
                     console.log('ok: '+f.length+' entries in '+d);"

  production-images:
    name: Production image build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Nothing else builds these production stages before a release tag; the api one is in schema-parity.
    strategy:
      fail-fast: false
      matrix:
        service: [worker, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production stage
        run: scripts/ci-retry.sh docker build --target production -f packages/${{ matrix.service }}/Dockerfile -t haive-${{ matrix.service }}-prod-check .

      # A channel build proves which modules an image carries from this file before it pushes anything.
      - name: The web image names the modules compiled into it
        if: matrix.service == 'web'
        run: |
          docker run --rm --network none --entrypoint cat haive-web-prod-check /app/packages/web/modules.generated.json |
            node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));
                     const s=m.find((x)=>x.id==='statistics');
                     if(!s||s.parts.join(',')!=='dashboard,web') throw new Error('statistics with parts dashboard and web is missing from the web image: '+JSON.stringify(m));
                     console.log('ok: '+m.map((x)=>x.id).join(','));"

  compose-boot:
    name: docker compose up (fresh-host boot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Compose builds through buildx bake, which refuses the npmrc build secret outside the project.
    env:
      BUILDX_BAKE_ENTITLEMENTS_FS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed .env for compose
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import os, re, secrets
          path = '.env'
          with open(path, 'r') as f:
              text = f.read()
          text = re.sub(
              r'^CONFIG_ENCRYPTION_KEY=.*$',
              'CONFIG_ENCRYPTION_KEY=' + secrets.token_hex(32),
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r'^JWT_SECRET=.*$',
              'JWT_SECRET=' + secrets.token_urlsafe(48),
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r'^HOST_REPO_ROOT=.*$',
              'HOST_REPO_ROOT=' + os.path.expanduser('~'),
              text,
              flags=re.MULTILINE,
          )
          with open(path, 'w') as f:
              f.write(text)
          PY

      - name: Pull registry images
        run: scripts/ci-retry.sh docker compose -f docker-compose.yml -f docker-compose.dev.yml pull --ignore-buildable postgres redis mailpit db-migrate

      - name: Build compose images
        run: scripts/ci-retry.sh docker compose -f docker-compose.yml -f docker-compose.dev.yml build

      - name: Start infrastructure
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis mailpit

      - name: Wait for postgres + redis health
        run: |
          for svc in postgres redis; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' haive-$svc 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then
                echo "$svc healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "$svc not healthy after 60s (status=$status)"
                docker compose -f docker-compose.yml -f docker-compose.dev.yml logs $svc
                exit 1
              fi
              sleep 2
            done
          done

      # `run --rm` starts a one-off container, which does NOT satisfy
      # `depends_on: service_completed_successfully`. So the `up -d api` below starts the
      # db-migrate SERVICE as well and the migrations run a second time — deliberately kept,
      # because that second run is a free idempotence check on every CI boot.
      - name: Apply database migrations (runs again under `up`, proving idempotence)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm db-migrate

      - name: Start api (populates shared node_modules volume)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d api

      - name: Probe api /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "api healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "api /health unreachable after 120s"
              docker compose -f docker-compose.yml -f docker-compose.dev.yml logs api
              exit 1
            fi
            sleep 2
          done

      - name: Start worker, web
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d worker web

      - name: Probe web root
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "web responded $code"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "web root unreachable after 120s (last=$code)"
              docker compose -f docker-compose.yml -f docker-compose.dev.yml logs web
              exit 1
            fi
            sleep 2
          done

      # Extraction is the one path whose behaviour differs between this runner and production, so its
      # test files run in BOTH. The host job above runs them against GNU tar as a non-root user; here
      # they run inside the worker image as root, which is the combination that actually ships — and
      # the only place the unprivileged-spawn branch (uid 65534) executes at all, since a non-root
      # process cannot setuid and silently keeps its own identity instead.
      - name: Extraction tests inside the worker image
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T worker \
            sh -c 'cd /app/packages/worker && node_modules/.bin/vitest run --root . test/repo-extract.test.ts test/tool-spawn.test.ts test/bundle-ingest.test.ts src/attachments/expand-archives.test.ts src/step-engine/steps/plan/plan-inputs.test.ts'

      - name: Dump service status
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml ps

      - name: Capture logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail 300

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  # The e2e suite has never run in CI, which is how one product change (registration closing)
  # silently killed 17 of 18 specs. It boots the same stack `compose-boot` does — deliberately its
  # own job rather than extra steps on that one, so that "the stack boots" and "the app works" stay
  # separately readable, and so renaming nothing breaks an existing required check.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Compose builds through buildx bake, which refuses the npmrc build secret outside the project.
    env:
      BUILDX_BAKE_ENTITLEMENTS_FS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Nothing under tests/ imports @haive/shared or @haive/database, so the workspace build the
      # other jobs need is skipped here on purpose — the specs talk to the stack over HTTP and SQL.
      - name: Typecheck the suite
        run: pnpm typecheck:e2e

      - name: Seed .env for compose
        run: |
          cp .env.example .env
          python3 - <<'PY'
          import os, re, secrets
          path = '.env'
          with open(path, 'r') as f:
              text = f.read()
          text = re.sub(
              r'^CONFIG_ENCRYPTION_KEY=.*$',
              'CONFIG_ENCRYPTION_KEY=' + secrets.token_hex(32),
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r'^JWT_SECRET=.*$',
              'JWT_SECRET=' + secrets.token_urlsafe(48),
              text,
              flags=re.MULTILINE,
          )
          # The PARENT of the checkout, not $HOME. The filesystem-browser specs need a directory
          # containing a real git repository at the root they browse, and this is the one place
          # that is true by construction: its only child is the checkout. Pointed at $HOME the
          # root is whatever the runner image happens to ship, which is not a fixture.
          text = re.sub(
              r'^HOST_REPO_ROOT=.*$',
              'HOST_REPO_ROOT=' + os.path.dirname(os.environ['GITHUB_WORKSPACE']),
              text,
              flags=re.MULTILINE,
          )
          with open(path, 'w') as f:
              f.write(text)
          PY

      # The browsed root needs more than the checkout in it. Its only child is a git repository,
      # which satisfies the specs looking for one but permanently skips the two that need a
      # NON-git directory and a HIDDEN one — and a test that can never run is barely better than
      # a deleted one. Two directories turn the root into a complete fixture.
      - name: Seed the browsable filesystem root
        run: |
          root="$(dirname "$GITHUB_WORKSPACE")"
          mkdir -p "$root/e2e-plain-dir" "$root/.e2e-hidden-dir"
          ls -a "$root"

      - name: Pull registry images
        run: scripts/ci-retry.sh docker compose -f docker-compose.yml -f docker-compose.dev.yml pull --ignore-buildable postgres redis mailpit db-migrate

      - name: Build compose images
        run: scripts/ci-retry.sh docker compose -f docker-compose.yml -f docker-compose.dev.yml build

      # Explicit service names, never a bare `up`: ollama and the two proxy sidecars carry no
      # `profiles:` gate, so `up` with no arguments would also pull ~9 GB of ollama that no spec
      # touches.
      - name: Start infrastructure
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis mailpit

      - name: Wait for postgres + redis health
        run: |
          for svc in postgres redis; do
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' haive-$svc 2>/dev/null || echo missing)
              if [ "$status" = "healthy" ]; then
                echo "$svc healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "$svc not healthy after 60s (status=$status)"
                docker compose -f docker-compose.yml -f docker-compose.dev.yml logs $svc
                exit 1
              fi
              sleep 2
            done
          done

      - name: Apply database migrations
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml run --rm db-migrate

      # api first and alone, exactly as compose-boot does it: it is what populates the shared
      # node_modules volume that worker and web then mount.
      - name: Start api (populates shared node_modules volume)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d api

      # Neither packages/api/Dockerfile nor packages/web/Dockerfile declares a HEALTHCHECK, and
      # web's `depends_on: api` is not conditioned on health, so compose can never report when
      # either is actually serving. These probes are the only thing that knows.
      - name: Probe api /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/health >/dev/null 2>&1; then
              echo "api healthy"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "api /health unreachable after 120s"
              docker compose -f docker-compose.yml -f docker-compose.dev.yml logs api
              exit 1
            fi
            sleep 2
          done

      - name: Start worker, web
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d worker web

      - name: Probe web root
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "web responded $code"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "web root unreachable after 120s (last=$code)"
              docker compose -f docker-compose.yml -f docker-compose.dev.yml logs web
              exit 1
            fi
            sleep 2
          done

      # --with-deps because a bare runner has none of chromium's shared libraries. `pnpm test:e2e`
      # runs `playwright install chromium` through its pretest hook, which then finds the browser
      # already present and costs a version check.
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the suite
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE: http://localhost:3001
          PLAYWRIGHT_DATABASE_URL: postgres://haive:haive_dev_password@localhost:5432/haive
        run: pnpm test:e2e

      # Its own step, and after the suite: it pulls a ~2 GB pinned browser image, so a failure in
      # the ordinary specs should surface without paying for that first. The baselines were
      # generated in this same image, which is the only reason comparing them here means anything.
      - name: Visual regression
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_BASE: http://localhost:3001
          PLAYWRIGHT_DATABASE_URL: postgres://haive:haive_dev_password@localhost:5432/haive
        run: bash scripts/visual.sh

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Dump service status
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml ps

      - name: Capture logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail 300

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
