# Platform coverage that ubuntu-amd64 CI cannot answer.
#
# `frictionless-bootstrapping-otter` items 7 and 8 ask two DIFFERENT questions, and separating
# them is what makes this affordable:
#
#   item 8 — do the CLI adapters install and run on arm64? The CLIs install into
#            node:24-bookworm-slim, a LINUX container, so this is an arm64-LINUX question and a
#            free native arm64 runner answers it. It is not a macOS question at all.
#   item 7 — does the stack boot on Apple Silicon under Docker Desktop / Colima? That genuinely
#            needs Apple hardware, which GitHub provides free to public repos.
#
# Not on every push: item 8 builds one image per adapter and item 7 boots a whole stack on a
# 3-core runner. Weekly, on demand, and whenever the files that decide the answer change.
name: Platform checks

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to install for the macOS check (blank = latest)'
        required: false
        type: string
  schedule:
    - cron: '0 4 * * 1'
  pull_request:
    paths:
      - 'packages/shared/src/cli-providers/install-metadata.ts'
      - 'packages/worker/sandbox-image/**'
      - 'packages/worker/src/cli-versions/codegen.ts'
      - 'packages/worker/src/sandbox/image-composer.ts'
      - 'packages/worker/scripts/check-cli-arch.ts'
      - 'install/**'
      - '.github/workflows/platform-checks.yml'

permissions:
  contents: read

jobs:
  cli-adapters-arm64:
    name: CLI adapters install on arm64 (item 8)
    # NATIVE arm64, not QEMU. An emulated npm install of five CLIs costs tens of minutes, and
    # emulation is also the wrong test: it can mask an "Exec format error" that a real arm64
    # host would hit, which is precisely the failure this job exists to catch.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # The script imports @haive/shared, whose dist the worker resolves through the workspace link.
      - run: pnpm --filter @haive/shared --filter @haive/database build

      - name: Compose and run every adapter
        # A distinct install id so the images this job builds cannot collide with anything else
        # sharing the runner, and so the naming module is exercised on arm64 too.
        env:
          HAIVE_INSTALL_ID: archcheck
        run: pnpm --filter @haive/worker exec tsx scripts/check-cli-arch.ts

  macos-preflight:
    name: Installer runs on Apple Silicon (item 7, no Docker)
    # Apple Silicon, and DELIBERATELY without Docker — see macos-boot below for why it cannot
    # have any. What this proves is still worth a minute: install.sh has never touched a BSD
    # userland, and its argument parsing, port probe and preflight all lean on sed/awk/grep,
    # whose macOS variants differ from GNU. A script that dies on `sed` here would fail on every
    # real Mac too, and no Docker is needed to find that out.
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: --help and an unknown option behave
        run: |
          set -euo pipefail
          sh install/install.sh --help | grep -q -- '--install-id'
          if sh install/install.sh --nonsense 2>/dev/null; then
            echo "::error::an unknown option was accepted"; exit 1
          fi

      - name: Preflight names Docker and changes nothing
        # No daemon can run here, so preflight MUST fail — the assertion is that it fails the
        # right way: naming Docker, pointing at Docker Desktop for this platform, and writing
        # nothing. Tolerant of which branch fires (binary absent vs daemon unreachable) because
        # the runner image may ship the CLI without a usable daemon.
        run: |
          set -uo pipefail
          out=$(sh install/install.sh --check --dir "$HOME/should-not-exist" 2>&1); code=$?
          echo "$out"
          [ "$code" -ne 0 ] || { echo "::error::preflight exited 0 with no Docker"; exit 1; }
          echo "$out" | grep -qi docker || { echo "::error::failure does not mention Docker"; exit 1; }
          [ ! -e "$HOME/should-not-exist" ] || { echo "::error::it created a directory anyway"; exit 1; }

  macos-boot:
    name: Installer boots on macOS (item 7, Intel)
    # INTEL, and that is forced rather than preferred. GitHub's Apple Silicon runners cannot run
    # Docker at all: they are themselves VMs, and Apple's Virtualization Framework does not
    # support nested virtualization — GitHub documents this, and MEASURED here, `colima start`
    # on macos-15 dies at "creating and starting" with an empty error set. The Intel image is
    # also the better-resourced one (4 CPU / 14 GB against 3 / 7).
    #
    # So this job proves macOS-ness — BSD userland, Colima rather than Docker Desktop, the whole
    # install/boot/uninstall cycle — and NOT arm64-ness. arm64 is covered without a Mac: every
    # image resolves a linux/arm64 manifest, and the adapter job above runs natively on arm64.
    # Item 7's "Apple Silicon boots the stack" clause needs real Apple hardware; a hosted runner
    # cannot answer it.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Colima and the docker CLI
        # Docker is not preinstalled on macOS runners, and Docker Desktop is a GUI application
        # whose licence nobody can accept on a runner's behalf. Colima is the headless path, and
        # also what a Mac user who declines Docker Desktop actually uses.
        run: |
          brew install docker docker-compose colima
          mkdir -p ~/.docker/cli-plugins
          ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose

      - name: Start the Docker VM
        run: |
          colima start --cpu 4 --memory 10 --disk 40
          docker version
          docker compose version

      - name: Docker actually works here
        run: docker run --rm alpine:latest uname -m

      - name: Install Haive from published images
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          args="--install-id ci --dir $HOME/haive-ci"
          [ -n "${VERSION_INPUT}" ] && args="$args --version ${VERSION_INPUT}"
          # shellcheck disable=SC2086
          sh install/install.sh $args

      - name: The stack reports the version it installed
        run: |
          set -euo pipefail
          port=$(sed -n 's/^HAIVE_API_PORT=//p' "$HOME/haive-ci/.env")
          pinned=$(sed -n 's/^HAIVE_VERSION=//p' "$HOME/haive-ci/.env")
          body=$(curl -fsS "http://localhost:${port}/version")
          echo "$body"
          echo "$body" | grep -q "\"version\":\"${pinned}\"" \
            || { echo "::error::/version does not report ${pinned}"; exit 1; }
          echo "$body" | grep -q '"devBuild":false' \
            || { echo "::error::published image reports devBuild true"; exit 1; }

      - name: Uninstall leaves nothing behind
        if: always()
        run: |
          cd "$HOME/haive-ci" 2>/dev/null || exit 0
          sh ./uninstall.sh --purge --yes
          left=$( { docker ps -aq --filter "name=^ci-"; docker volume ls -q --filter "name=^ci_"; } | wc -l | tr -d ' ')
          [ "$left" = "0" ] || { echo "::error::$left object(s) left behind"; exit 1; }
